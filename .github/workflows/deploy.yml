name: Build and deploy TAL Podcasting 2.0 RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * 1"
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build RSS and VTT
        run: |
          python generate.py \
            --episodes 30 \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
