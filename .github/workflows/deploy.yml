name: Update TAL transcript feed

on:

  # 手动运行
  workflow_dispatch:

    inputs:

      refresh_archive:

        description: "重抓全部年份的 archive 页（默认只用缓存）。改过 parse_archive_year 后要跑一次，缓存里那些年被丢弃的行才会补回来。"

        type: boolean

        default: false

  # 每周一自动更新（UTC 05:00）
  schedule:
  - cron: "0 5 * * 1"

# 与 translate.yml 共用同一并发组，避免同时推送/部署 Pages
concurrency:
  group: tmlt-pages
  cancel-in-progress: false

permissions:

  # 需要提交 public 更新
  contents: write

  # GitHub Pages
  pages: write

  id-token: write


jobs:

  update:

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:


      # 拉取仓库（包含之前生成的 public）
      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0



      # Python环境
      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"



      # 安装依赖
      - name: Install dependencies

        run: |

          pip install -r requirements.txt



      # 增量生成 RSS 和 VTT
      - name: Generate TAL transcript feed

        run: |

          ARGS=()

          if [ "${{ inputs.refresh_archive }}" = "true" ]; then

            ARGS+=(--refresh-archive)

          fi



          python generate.py \
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
          --output docs \
          "${ARGS[@]}"



      # 保存生成结果到仓库
      #
      # 下一次运行 checkout 时会拿到这些文件
      #
      - name: Commit generated files

        run: |

          git config user.name "github-actions"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add docs


          git diff --cached --quiet || git commit -m "Update TAL transcript feed"


          # align 的 cron 每隔几分钟就往 main 推一次 sidecar，裸 push 撞上
          # non-fast-forward 会把整次部署打掉（实测两次都停在这里）。按
          # align-timings 的做法 rebase 重试。
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          echo "push failed after 5 attempts" >&2
          exit 1



      # 配置 GitHub Pages
      - name: Setup Pages

        uses: actions/configure-pages@v5



      # 上传 Pages 内容
      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:

          path: ./docs



      # 部署 GitHub Pages
      - name: Deploy GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4
