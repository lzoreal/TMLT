name: Mirror masters to audio vault

# 877 集母带 39 GB 不进任何 git 历史：TMLT 是 public 且 docs/ 就是 Pages 根，
# 音频一旦进主仓库，一次投诉会把站点和 873 集逐词时间轴一起带走。
# 所以本 workflow 只做「下载 → 原样校验 → 上传到 private 保险库的 release」。
#
# 为什么两头都要：release 的容量政策不分 public/private（单文件 <2 GiB、
# 每个 release ≤1000 资产、总大小与带宽都不限，877 集一个 release 装得下），
# 但 Actions 分钟数分——public 仓库的 Linux job 免费且不占月度配额，
# private 仓库要消耗套餐分钟数。任务跑在 public 的 TMLT，产物传去 private 的 vault。
#
# 幂等：release 上已有同名资产且 size+digest 都对得上就跳过，重跑只补漏。
# 冒烟：commit 关掉时只下载并算 sha256，不创建 tag、不传资产。
#
# 定时：每月 1 日重探全部 URL（发现 TAL 加了新集 / 换了指纹）→ 补传保险库缺的
# 那几集 → 把清单连同新基线提交回 main。needs_upload 认远端账本，健康月份待传 0 集，
# 一轮只花 HEAD 的几分钟，不会重搬 39 GB。
#
# 不分片：增量每月只有几集，一个 job 几分钟收工；矩阵只会多开 20 个 job
# 各自翻页读同一份账本。真要把 39 GB 重搬一遍（单 job 会撞 6 小时上限），
# audio_backup.py plan 仍能把集号摊成多档，带矩阵的这版 workflow 在 git 历史里。

on:
  schedule:
    # 06:20 而非整点：避开 align-timings 每小时的 cron 波；每月 1 日也避开了
    # deploy 的周一 05:00（那是 tmlt-pages 组，与本组不冲突，只是少抢 runner）。
    - cron: "20 6 1 * *"
  workflow_dispatch:
    inputs:
      episodes:
        description: "逗号分隔的集号（留空 = 按清单全部核对，仍只补传缺的）"
        default: ""
      repo:
        description: "保险库仓库 owner/name（private）"
        default: "lzoreal/tmlt-audio-vault"
      tag:
        description: "逗号分隔的卷；新集只传到最后一卷，前面的卷仍算已备份"
        default: "audio-vault"
      target:
        description: "tag 落在保险库的哪条分支"
        default: "audio"
      refresh_ledger:
        description: "先重探全部 URL 并把清单提交回 main（定时触发必做，手工默认不越权）"
        type: boolean
        default: false
      commit:
        description: "真的上传 release（冒烟测试关掉：只下载校验，不碰 release）"
        type: boolean
        default: false

concurrency:
  group: tmlt-audio-vault
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      # 只有清单那一步需要写 main；传资产用的是 AUDIO_VAULT_TOKEN。
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Re-probe masters and write the ledger
        id: probe
        if: ${{ github.event_name == 'schedule' || inputs.refresh_ledger }}
        run: |
          set -o pipefail
          # 退出码 1 = 有母带"从活到死"。清单文件已写但绝不提交：一次 HEAD 抖动
          # 被写成事实，下一轮只会照着死链接重探，待镜像里也永久少了那一集。
          # 这一步失败让整轮变红，红色就是告警本身。
          python -X utf8 audio_backup.py manifest --workers 16 | tee manifest.log
          grep '^Manifest:' manifest.log >> "$GITHUB_STEP_SUMMARY"
      - name: Mirror what the vault is missing
        id: mirror
        env:
          GH_TOKEN: ${{ secrets.AUDIO_VAULT_TOKEN }}
          # 定时触发没有 inputs，一律取仓库里的默认值；空 tag 会被 --tag 至少要有一卷拒掉。
          VAULT_REPO: ${{ inputs.repo || 'lzoreal/tmlt-audio-vault' }}
          TAG: ${{ inputs.tag || 'audio-vault' }}
          TARGET: ${{ inputs.target || 'audio' }}
          EPISODES: ${{ inputs.episodes }}
          # 定时波是真传：手工 run 才保留"默认冒烟"的保险。
          COMMIT: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
          OUT: ${{ runner.temp }}/vault
        run: |
          set -o pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "缺少 secrets.AUDIO_VAULT_TOKEN：需要一个只对保险库仓库有 Contents 写权限的 fine-grained token" >&2
            exit 1
          fi
          # 不带 --episodes 就是"整本清单对一遍，只传保险库缺的"——增量的正解。
          ARGS=(release --out "$OUT" --repo "$VAULT_REPO" --tag "$TAG" --target "$TARGET")
          if [ -n "$EPISODES" ]; then
            ARGS+=(--episodes "$EPISODES")
          fi
          if [ "$COMMIT" != "true" ]; then
            ARGS+=(--no-push)
          fi
          python -X utf8 audio_backup.py "${ARGS[@]}"
          # 只有真传的那一轮才记账：--no-push 冒烟不该动 main。
          if [ "$COMMIT" = "true" ]; then
            echo "mirrored=true" >> "$GITHUB_OUTPUT"
            # 保险库里的字节 GitHub 早就算好 sha256。认回清单当基线（来源标 vault），
            # 下一轮才对得上 899 集的账，而不是只有本地真下过的那几十集。
            python -X utf8 audio_backup.py sync --repo "$VAULT_REPO" --tag "$TAG"
          fi
      - name: Commit the ledger
        # 提交放在传完之后，不放在重探之后：release 步骤会把本轮真下过的 sha256 写进
        # 清单，早提交的那些字节随工作树一起销毁，清单就永远只有几十集有基线可比。
        # probe 红（发现"从活到死"）时不提交；mirror 红但账本已重探过，仍要提交。
        if: ${{ !cancelled() && (steps.probe.outcome == 'success' || steps.mirror.outputs.mirrored == 'true') }}
        run: |
          set -o pipefail
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/audio-manifest.json; then
            echo "账本没变：本轮没有新账要记"
            exit 0
          fi
          git add docs/audio-manifest.json
          git commit -m "Refresh archive audio ledger"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              pushed=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          # 没推进 main 就硬停：工作树随 runner 销毁，这轮记的账等于什么都没留下，
          # 而下个月还会在同一处红一次。
          if [ "$pushed" != 1 ]; then
            echo "清单提交 5 次都没推上 main" >&2
            exit 1
          fi
      - name: Upload release index
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-index
          path: ${{ runner.temp }}/vault/release-index.json
          if-no-files-found: ignore
          retention-days: 30
